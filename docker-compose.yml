
services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html:Z
      - ./src:/var/www/src:Z
      - ./vendor:/var/www/vendor:ro,Z
      - ./php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro,Z
    depends_on:
      - db

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: practica
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  db_data:
